[package]
name = "qt-sources-gen"
version = "0.1.0"
edition = "2024"
license = "MIT-0"
rust-version.workspace = true

[dependencies]
reqwest = { version = "0", features = ["blocking"] }
sha2 = "0"
md-5 = "0"
hex = "0"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"


[lints]
workspace = true
